# 秒杀系统 — 生产环境配置
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:3306/seckill?useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
  redis:
    host: ${REDIS_HOST:redis-cluster}
    port: 6379
    password: ${REDIS_PASSWORD:}
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 50
        max-idle: 20
        min-idle: 5

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:sentinel:8080}
      eager: true

rocketmq:
  name-server: ${ROCKETMQ_NS:rocketmq-ns:9876}
  producer:
    group: seckill-prod-group
    send-message-timeout: 3000
  consumer:
    group: seckill-consume-group

server:
  port: 8081
  tomcat:
    threads:
      max: 200
    accept-count: 500

logging:
  level:
    com.seckill: WARN
  file:
    path: /var/log/seckill
