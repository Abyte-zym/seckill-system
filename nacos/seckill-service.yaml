# Nacos 配置中心 - seckill-service.yaml
# 发布到 Nacos 后会被 seckill-service 自动加载
# dataId: seckill-service.yaml, group: DEFAULT_GROUP

server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/seckill?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password: 123456
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 100
      max-wait: 3000

  redis:
    host: redis
    port: 6379
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 64
        max-idle: 16
        min-idle: 8

rocketmq:
  name-server: rocketmq:9876
  producer:
    group: seckill-producer-group
    send-message-timeout: 3000

# Sentinel 规则持久化（Nacos 数据源）
# 控制台配置的规则会自动保存到 Nacos，重启不丢失
# dataId: seckill-service-flow-rules
# dataId: seckill-service-degrade-rules

seckill:
  stock-prefix: "seckill:stock:"
  user-bought-prefix: "seckill:user:"
  order-topic: "seckill-order"
  limit-per-user: 1
